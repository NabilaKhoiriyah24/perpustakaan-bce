<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Data Anggota - Perpustakaan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/pinjam">🏛️ Sistem Perpustakaan</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/pinjam">Pinjam Buku</a>
                <a class="nav-link" href="/buku">Data Buku</a>
                <a class="nav-link active fw-semibold" href="/anggota">Data Anggota</a>
            </div>
        </div>
    </nav>

    <div class="container py-3">
        <div class="row justify-content-center">
            <div class="col-md-9">
                <div class="card shadow border-0 rounded-4">
                    <div class="card-body p-4">
                        <h3 class="fw-bold text-primary mb-4">👥 Data Anggota Perpustakaan</h3>

                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-dark">
                                    <tr>
                                        <th>ID Anggota</th>
                                        <th>Nama Lengkap</th>
                                        <th class="text-center">Sisa Kuota Pinjam</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="a : ${daftarAnggota}">
                                        <td class="fw-bold text-secondary" th:text="${a.idAnggota}">A001</td>
                                        <td class="fw-semibold" th:text="${a.nama}">Nama Anggota</td>
                                        <td class="text-center">
                                            <span class="badge bg-primary fs-6" th:text="${a.batasPinjam} + ' Buku'">2 Buku</span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
