<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bukti Peminjaman - Perpustakaan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/pinjam">🏛️ Sistem Perpustakaan</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link active fw-semibold" href="/pinjam">Pinjam Buku</a>
                <a class="nav-link" href="/buku">Data Buku</a>
                <a class="nav-link" href="/anggota">Data Anggota</a>
            </div>
        </div>
    </nav>

    <div class="container py-3">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-0 rounded-4">
                    <div class="card-body p-4 text-center">
                        <div class="mb-3">
                            <span class="fs-1">✅</span>
                        </div>
                        <h3 class="fw-bold text-success mb-3">Peminjaman Berhasil!</h3>
                        
                        <ul class="list-group list-group-flush text-start mb-4">
                            <li class="list-group-item d-flex justify-content-between">
                                <span class="text-muted">ID Transaksi:</span>
                                <span class="fw-bold" th:text="${bukti.idTransaksi}">T001</span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between">
                                <span class="text-muted">Nama Anggota:</span>
                                <span class="fw-bold" th:text="${bukti.namaAnggota}">Nama</span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between">
                                <span class="text-muted">Judul Buku:</span>
                                <span class="fw-bold" th:text="${bukti.judulBuku}">Judul</span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between">
                                <span class="text-muted">Tanggal Pinjam:</span>
                                <span class="fw-bold" th:text="${bukti.tanggalPinjam}">2026-10-30</span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between">
                                <span class="text-muted">Status:</span>
                                <span class="badge bg-success" th:text="${bukti.status}">DIPINJAM</span>
                            </li>
                        </ul>

                        <a href="/pinjam" class="btn btn-primary w-100 rounded-pill">Kembali ke Peminjaman</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
