<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tambah Buku - Perpustakaan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/pinjam">🏛️ Sistem Perpustakaan</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/pinjam">Pinjam Buku</a>
                <a class="nav-link active fw-semibold" href="/buku">Data Buku</a>
                <a class="nav-link" href="/anggota">Data Anggota</a>
            </div>
        </div>
    </nav>

    <div class="container py-3">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-0 rounded-4">
                    <div class="card-body p-4">
                        <h3 class="fw-bold text-primary mb-4">➕ Tambah Buku Baru</h3>
                        <form th:action="@{/buku/tambah}" method="post">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">ID Buku</label>
                                <input type="text" name="idBuku" class="form-control" placeholder="Contoh: B004" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Judul Buku</label>
                                <input type="text" name="judul" class="form-control" placeholder="Masukkan judul buku" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Jumlah Stok</label>
                                <input type="number" name="stok" class="form-control" min="0" value="1" required>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary w-100">Simpan Buku</button>
                                <a href="/buku" class="btn btn-outline-secondary w-100">Batal</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
