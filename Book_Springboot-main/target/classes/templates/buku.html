<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Data Buku - Perpustakaan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/pinjam">🏛️ Sistem Perpustakaan</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/pinjam">Pinjam Buku</a>
                <a class="nav-link active fw-semibold" href="/buku">Data Buku</a>
                <a class="nav-link" href="/anggota">Data Anggota</a>
            </div>
        </div>
    </nav>

    <div class="container py-3">
        <div class="row justify-content-center">
            <div class="col-md-9">
                <div class="card shadow border-0 rounded-4">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h3 class="fw-bold text-primary mb-0">📖 Katalog Buku</h3>
                            <a href="/buku/tambah" class="btn btn-success rounded-pill px-4">+ Tambah Buku</a>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-dark">
                                    <tr>
                                        <th>ID Buku</th>
                                        <th>Judul Buku</th>
                                        <th class="text-center">Stok Tersedia</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="b : ${daftarBuku}">
                                        <td class="fw-bold text-secondary" th:text="${b.idBuku}">B001</td>
                                        <td class="fw-semibold" th:text="${b.judul}">Judul</td>
                                        <td class="text-center">
                                            <span class="badge fs-6" th:classappend="${b.stok > 0} ? 'bg-info text-dark' : 'bg-danger'" th:text="${b.stok}">0</span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
